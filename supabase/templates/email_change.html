<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f5f2;font-family:-apple-system,Segoe UI,Roboto,sans-serif">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#2b2a33">Confirm your new email</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#2b2a33">Click the button to use {{ .NewEmail }} for your account from now on. Until you do, your old address stays in place.</p>
      <p style="margin:24px 0">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;background:#2b2a33;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;font-size:15px">Confirm new email</a>
      </p>
      <p style="margin:24px 0 0;font-size:12px;color:#5d5b66">You're getting this because of an action on your account. If it wasn't you, you can ignore it.</p>
    </div>
  </body>
</html>
